{{- $root := . }}

{{- $ceosDefaultImg := "docker.io/library/ceos:4.35.0F" }}
{{- $ceosDefaultMemory := "4Gi" }}
{{- $ceosDefaultCpu := "2000m" }}

{{- $networkTypeMap := include "netclab.networkTypeMap" $root | fromYaml }}

{{- range $i, $node := .Values.topology.nodes }}
{{- $nodeName := .name }}
{{- if eq .type "ceos" }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ .name }}
  annotations:
    k8s.v1.cni.cncf.io/networks: {{ include "netclab.nodeNetworks" (dict "node" $node "networkTypeMap" $networkTypeMap "root" $root) }}
  labels:
    vendor: arista
    {{- include "netclab.labels" $root | nindent 4 }}
    {{ $root.Chart.Name }}/pod-name: {{ .name }}
spec:
  terminationGracePeriodSeconds: 0
  affinity:
  {{- include "netclab.podAffinity" $root | nindent 4 }}
  containers:
  - name: {{ .name }}
    image: {{ default $ceosDefaultImg .image }}
    env:
    - name: INTFTYPE
      value: eth
    - name: ETBA
      value: "1"
    - name: SKIP_ZEROTOUCH_BARRIER_IN_SYSDBINIT
      value: "1"
    - name: CEOS
      value: "1"
    - name: EOS_PLATFORM
      value: ceoslab
    - name: container
      value: docker
    command:
    - /sbin/init
    - systemd.setenv=INTFTYPE=eth
    - systemd.setenv=ETBA=1
    - systemd.setenv=SKIP_ZEROTOUCH_BARRIER_IN_SYSDBINIT=1
    - systemd.setenv=CEOS=1
    - systemd.setenv=EOS_PLATFORM=ceoslab
    - systemd.setenv=container=docker
    securityContext:
      privileged: true
      runAsUser: 0
      runAsGroup: 0
    resources:
      limits:
        memory: {{ default $ceosDefaultMemory .memory }}
        cpu: {{ default $ceosDefaultCpu .cpu }}
    volumeMounts:
    - name: ceos-startup-config
      mountPath: /mnt/flash/startup-config
      subPath: startup-config
      readOnly: true
  volumes:
  - name: ceos-startup-config
    configMap:
      name: ceos-startup-config
      items:
      - key: startup-config
        path: startup-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    vendor: arista
    {{- include "netclab.labels" $root | nindent 4 }}
    {{ $root.Chart.Name }}/pod-name: {{ .name }}
  name: {{ .name }}
spec:
  selector:
    vendor: arista
    {{- include "netclab.labels" $root | nindent 4 }}
    {{ $root.Chart.Name }}/pod-name: {{ .name }}
  ports:
  - name: restconf
    protocol: TCP
    port: 6020
    targetPort: 6020
  - name: eapi
    protocol: TCP
    port: 443
    targetPort: 443
  - name: ssh
    protocol: TCP
    port: 22
    targetPort: 22
---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    vendor: arista
    {{- include "netclab.labels" $root | nindent 4 }}
    {{ $root.Chart.Name }}/pod-name: {{ .name }}
  name: {{ .name }}-generate-cert
spec:
  backoffLimit: 6
  template:
    spec:
      terminationGracePeriodSeconds: 0
      restartPolicy: OnFailure
      volumes:
      - name: cmds-vol
        configMap:
          name: ceos-cmds
      containers:
      - name: curl
        image: curlimages/curl:latest
        volumeMounts:
        - name: cmds-vol
          mountPath: /tmp
          readOnly: true
        command:
        - /bin/sh
        - -c
        - |
            post() {
              curl -sk --fail-with-body -u arista:arista \
                   https://{{ .name }}/command-api \
                   -H "Content-Type: application/json" -d @"$1"
            }

            # Wait for the device here rather than by exiting and letting the
            # Job restart the container. With restartPolicy OnFailure the whole
            # cEOS boot has to fit inside backoffLimit restarts of a growing
            # backoff -- a budget that depends on how fast the node boots, and
            # that a slow device silently loses. Waiting in one attempt makes
            # the timeout explicit and leaves backoffLimit for real failures.
            deadline=$(( $(date +%s) + 600 ))

            echo "Attempting certificate generation on {{ .name }}..."

            # Neither half of this check is optional. curl exits 0 on an HTTP
            # 404, and on a cold boot nginx answers on 443 with "Page not
            # found" for a while before eAPI is registered -- so the exit code
            # alone would report success without ever having reached the
            # device. --fail-with-body makes that a failure. The `"result"`
            # test covers the other half: eAPI reports a *failed command*
            # inside an HTTP 200, as an `error` member.
            until out=$(post /tmp/cmds) && echo "$out" | grep -q '"result"' ; do
              if [ "$(date +%s)" -ge "$deadline" ] ; then
                echo "eAPI never became ready on {{ .name }}: $out"
                exit 1
              fi
              echo "eAPI not ready yet, retrying..."
              sleep 10
            done

            echo "Certificate generated. Verifying RESTCONF came up..."

            # And the commands succeeding still does not mean RESTCONF is
            # serving: the SSL profile is re-evaluated asynchronously, so ask
            # the device until it says the server is enabled.
            until out=$(post /tmp/verify) && echo "$out" | grep -q '"enabled":true' ; do
              if [ "$(date +%s)" -ge "$deadline" ] ; then
                echo "RESTCONF is not enabled on {{ .name }}: $out"
                exit 1
              fi
              echo "RESTCONF not up yet, retrying..."
              sleep 5
            done

            echo "RESTCONF is up on {{ .name }}."

{{- end }}
{{- end }}
