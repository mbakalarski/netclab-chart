apiVersion: v1
kind: ConfigMap
metadata:
  name: ceos-startup-config
data:
  startup-config: |
    !
    username arista privilege 15 secret 0 arista
    !
    management api http-commands
      protocol https
      no shutdown
    !
    {{- /*
    RESTCONF rides EOS's own self-signed profile, which the device generates
    for itself -- so RESTCONF comes up from this file alone, with nothing for
    the chart to generate and nothing to order. Verified from a cold boot: the
    profile is already valid when this config is applied, which is the part
    that matters, since EOS never revisits an "invalid" verdict on a profile.

    Earlier releases pointed at a `restconf` profile whose certificate a Job
    created after boot. That could not hold: this ConfigMap is the only thing
    mounted into /mnt/flash, so the config survives a container restart while
    the generated certificate -- written to the container's writable layer --
    does not. The profile then referenced a file that no longer existed and
    RESTCONF stayed down, with the Job long since Complete and never re-run.

    Both certificates are self-signed, and neither carries a CN matching the
    Service a client connects to -- so the generated one was no better placed
    for a client that does verify, and cost a Job to obtain. For a certificate
    that can actually be verified, configure a profile yourself and point
    ceos.restconfSslProfile at it.
    */}}
    management api restconf
       transport https test
       ssl profile {{ (.Values.ceos).restconfSslProfile | default "ARISTA_DEFAULT_SELF_SIGNED_PROFILE" }}
    !
    ip access-list custom-cp
       counters per-entry
       10 permit icmp any any
       20 permit ip any any tracked
       30 permit udp any any eq bfd ttl eq 255
       40 permit udp any any eq bfd-echo ttl eq 254
       50 permit udp any any eq multihop-bfd micro-bfd sbfd
       60 permit udp any eq sbfd any eq sbfd-initiator
       70 permit ospf any any
       80 permit tcp any any eq ssh telnet www snmp bgp https msdp ldp netconf-ssh gnmi
       90 permit udp any any eq bootps bootpc snmp rip ntp ldp ptp-event ptp-general
       100 permit tcp any any eq mlag ttl eq 255
       110 permit udp any any eq mlag ttl eq 255
       120 permit vrrp any any
       130 permit ahp any any
       140 permit pim any any
       150 permit igmp any any
       160 permit tcp any any range 5900 5910
       170 permit tcp any any range 50000 50100
       180 permit udp any any range 51000 51100
       190 permit tcp any any eq 3333
       200 permit tcp any any eq nat ttl eq 255
       210 permit tcp any eq bgp any
       220 permit rsvp any any
       230 permit tcp any any eq 9340
       240 permit tcp any any eq 9559
       250 permit udp any any eq 8503
       260 permit udp any any eq lsp-ping
       270 permit udp any eq lsp-ping any range 51900 51999
       280 permit tcp any any eq 6020
    !
    system control-plane
       ip access-group custom-cp in
    !
    end
